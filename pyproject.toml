[project]
name = "trace"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core scientific computing
    "numpy>=2.0.1",
    "pandas>=2.2.3",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # PyTorch ecosystem — pulled from PyTorch's own index (see below)
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "torchvision>=0.16.0",
    # ML & NLP
    "transformers>=4.41.2",
    "tokenizers>=0.19.1",
    "huggingface-hub>=0.23.4",
    "safetensors>=0.5.3",
    "sentencepiece>=0.2.0",
    # Google API
    "google-api-python-client>=2.170.0",
    "google-auth>=2.38.0",
    "google-auth-httplib2>=0.2.0",
    # Jupyter
    "jupyterlab>=4.4.3",
    "notebook>=7.4.3",
    "ipywidgets>=8.1.7",
    "ipykernel>=6.29.5",
    # Utilities
    "tqdm>=4.67.1",
    "pyyaml>=6.0.2",
    "regex>=2024.11.6",
    # Statistical modeling
    "statsmodels>=0.14.4",
    "patsy>=1.0.1",
    # ML tooling
    "datasets",
    "accelerate",
    "wandb",
    "tensorboard",
    "ipython-autotime",
    "detoxify>=0.5.2",
]

# Cross-platform torch:
#   - Linux/Windows: pull CUDA 12.4 wheels from PyTorch's own index
#   - macOS: use the default PyPI wheel (ships with MPS support on Apple Silicon)
# Runtime device selection is handled by evaluations/device.py, which falls
# back CUDA -> MPS -> CPU automatically, so the same code runs on any platform.
[tool.uv.sources]
torch       = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio  = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url  = "https://download.pytorch.org/whl/cu124"
explicit = true